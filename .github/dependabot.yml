version: 2
# Twice a year: a weekly schedule kept a queue of open PRs that nobody was
# reviewing. Security updates are not affected by this and still arrive as soon
# as an advisory is published. Updates target `develop`, like every other
# change, instead of going straight to production on `main`.
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "semiannually"
    commit-message:
      prefix: "fix"
      prefix-development: "chore"
      include: "scope"
    versioning-strategy: increase
    labels:
      - "📦 Dependencies"
    open-pull-requests-limit: 10
    groups:
      # Everything in one PR per run: two runs a year, two PRs at most (npm and
      # GitHub Actions). Majors come in the same PR and are tested together; a
      # major that breaks is taken out of that PR, not given its own.
      npm:
        patterns:
          - "*"
    ignore:
      # @astrojs/check only accepts TypeScript ^5 || ^6, so a TypeScript major
      # fails the install (see #186).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "semiannually"
    labels:
      - "📦 Dependencies"
      - "🚀 CI/CD"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
